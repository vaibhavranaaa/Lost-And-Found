<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Basic page settings -->
    <meta charset="UTF-8">

    <!-- Responsive layout -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Lost & Found</title>

    <!-- Main CSS file -->
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>

    <!-- =========================================
         REGISTER PAGE
    ========================================== -->

    <main class="auth-page">

        <!-- Registration card -->
        <section class="auth-card">

            <!-- Header -->
            <div class="auth-header">

                <div class="brand-icon">
                    🔎
                </div>

                <h1>Lost & Found</h1>

                <p>
                    Create your account and get started.
                </p>

            </div>


            <!-- Registration form -->
            <form id="registerForm" class="auth-form">

                <!-- Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Submit button -->
                <button
                    type="submit"
                    class="primary-btn"
                >
                    Create Account
                </button>


                <!-- Message from JavaScript -->
                <p
                    id="message"
                    class="form-message"
                ></p>

            </form>


            <!-- Login section -->
            <div class="auth-divider">
                <span>Already have an account?</span>
            </div>

            <a
                href="./index.html"
                class="secondary-btn"
            >
                Login to Your Account
            </a>

        </section>

    </main>


    <!-- Register JavaScript -->
    <script src="./js/register.js"></script>

</body>

</html>

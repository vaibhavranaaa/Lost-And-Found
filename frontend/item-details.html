<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Item Details - Lost & Found</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navigation -->
    <header class="main-header">

        <a href="user-dashboard.html" class="brand">

            <span class="brand-icon">🔎</span>

            <span>Lost & Found</span>

        </a>


        <nav class="main-nav">

            <a
                href="user-dashboard.html"
                class="nav-link">
                Dashboard
            </a>

            <a
                href="items.html"
                class="nav-link active">
                Items
            </a>

            <a
                href="report-item.html"
                class="nav-link">
                Report Item
            </a>

            <a
                href="claims.html"
                class="nav-link">
                My Claims
            </a>

            <button
                id="logoutBtn"
                class="logout-btn">
                Logout
            </button>

        </nav>

    </header>


    <!-- Main Content -->
    <main class="item-details-page">


        <!-- Message -->
        <div
            id="message"
            class="item-details-message">
        </div>


        <!-- Back Link -->
        <a
            href="items.html"
            class="back-to-items">
            ← Back to Items
        </a>


        <!-- Item Details -->
        <section
            id="itemDetails"
            class="details-card">
        </section>


        <!-- Claim Section -->
        <section
            id="claimSection"
            class="claim-box">


            <div class="claim-box-header">

                <div class="claim-icon">
                    🤝
                </div>

                <div>

                    <span class="claim-label">
                        ITEM CLAIM
                    </span>

                    <h2>
                        Claim This Item
                    </h2>

                </div>

            </div>


            <p class="claim-description">

                If this item belongs to you, explain why you are
                claiming it. Provide enough information to help
                verify your ownership.

            </p>


            <label
                for="claimMessage"
                class="claim-input-label">
                Your Message
            </label>


            <textarea
                id="claimMessage"
                rows="5"
                placeholder="Explain why this item belongs to you..."
            ></textarea>


            <div class="claim-form-footer">

                <span class="claim-hint">
                    💡 Be specific about identifying details.
                </span>


                <button
                    id="claimBtn"
                    class="claim-submit-btn">

                    Submit Claim
                    <span>→</span>

                </button>

            </div>


            <p
                id="claimMessageResult"
                class="claim-result">
            </p>


        </section>


    </main>


    <script src="js/item-details.js"></script>

</body>

</html>
